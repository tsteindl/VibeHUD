[platformio]
default_envs = vibehud
src_dir = firmware/VibeHUD

[env:vibehud]
; Match the Arduino 3.3.11 core used for the working physical prototype.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728
board_build.partitions = partitions.csv

; Waveshare's supplied, patched LVGL library is installed by scripts/fetch_vendor.py.
lib_deps = lvgl=symlink://.deps/lvgl
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Ifirmware/VibeHUD

upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
