[project]
name = "vibehud"
version = "0.1.0"
description = "PC agent that feeds the VibeHUD USB display"
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5", "tomli>=2; python_version < '3.11'"]

[project.scripts]
vibehud = "vibehud.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vibehud"]
